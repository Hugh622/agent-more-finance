# =====================================================================
# rules_registry.yaml — C/R/N/D/K/W/G＋P0 規則註冊冊（方法學線 P1② 定稿 v1.0.0）
# 生成 SQL 用源文件；載入目標 warren_learning_db.rules（經全棧單寫者執行）
# 混合模式：本 YAML=元數據/參數/版本；Python 主體=logic_ref（含單測）；流程類規則 logic.mode=process
# 收編基準：框架 v1.2 正式定稿（2026-09-27）＋v1.1（R1-R10/N1-N8）＋P0 v1.0（2026-09-12/09-16）
#           ＋23/5 修訂（2026-10-10，執行線現行口徑）
# 72 行（含歷史版本）：P0×8（C1/C2/E0 各含 2 版）｜ C×19 ｜ R×10 ｜ N×19（不採納邊界）｜ D×3 ｜ K×6 ｜ G×2 ｜ W×5
# =====================================================================
meta:
  registry_version: "1.0.0"
  date: "2026-10-11"
  owner_leg: "量化技術專家（方法學線）"
  supersedes_note: "supersedes 欄=被取代版本 rule_id@version；鏈條在 SQL 中經 id 外鍵閉合"
  placeholder_retire: ["C@1.0.0","R@1.0.0","N@1.0.0","D@1.0.0","K@1.0.0","W@1.0.0","G@1.0.0"]
  naming_decisions:
    - "P0 確認制五件獨立命名空間 P0.C1/P0.C2/P0.C3/P0.E0/P0.E1——避免與 v1.2 C 系列撞號（框架明文：兩套並行系統）"
    - "v1.2 拒收終版①-⑪ 收編為 N9-N19（N1-N8 已被 v1.1 不採納清單占用，順延）"
    - "23/5 研究報告新編 N1（隔夜假突破統計）→ 重編 D3：語義本屬記帳觀察，且 N1 已占用；溯源寫入 notes"
    - "T4 大盤總閘=現行閘重申，依裁決不佔新編號——作 C18 parameters 附註，不單獨立冊"
    - "台賬 G1(11/6-7)/G2(12/18-20) 雙門=實盤準入驗證關口（M 族里程碑），非規則——不入本冊，與 TW G1/G2 嚴格區分"

rules:
  # ---------------- P0 確認制＋過濾器 ----------------
  - {rule_id: "P0.C1", version: "1.0.0", status: retired, owner: quantitative, scope: [US,HK,CN],
     inputs: [close, breakout_level], entry_effective: next_tradable_bar,
     parameters: {buffer_pct: 0.002, basis: "收盘越位（收盤價站上前高突破位＋0.2%緩衝方確認，盤中假越位不算）"},
     logic_mode: python, logic_ref: "bt_engine.rules_p0::c1_close_break",
     logic_desc: "C1 收盤越位確認 v1.0：收盤＞突破位×(1+0.002) 才確認；盤中越位不作數",
     invalidation: "回測判決 EXP-2026-001 NO-GO 或覆盤證實失效→永久撤回", supersedes: null,
     validation_experiment_id: "EXP-2026-001", notes: "v1.0 定稿 2026-09-12；v1.1 承繼不變"}
  - {rule_id: "P0.C1", version: "1.2.0", status: active, owner: quantitative, scope: [US],
     inputs: [close, breakout_level, session], entry_effective: next_tradable_bar,
     parameters: {buffer_pct: 0.002, close_definition: "16:00 ET OCP（正式收盤競價 print）", overnight_bars: "23×5 隔夜段打印不具確認資格"},
     logic_mode: python, logic_ref: "bt_engine.rules_p0::c1_close_break_v12",
     logic_desc: "C1 收盤明文修訂（23/5）：美市確認價=16:00 ET OCP；隔夜段『T』條件打印不得觸發 C1",
     invalidation: "回測判決 EXP-2026-001 NO-GO 或 12/8 校準報告證偽→回退 1.0.0 口徑", supersedes: "P0.C1@1.0.0",
     validation_experiment_id: "EXP-2026-001", notes: "2026-10-10 23/5 修訂；框架 v1.4 收編程序進行中；HK/CN 維持 1.0.0 口徑"}
  - {rule_id: "P0.C2", version: "1.0.0", status: retired, owner: quantitative, scope: [US,HK,CN],
     inputs: [volume, ma20_volume], entry_effective: next_tradable_bar,
     parameters: {vol_gate: 1.5, vol_soft_floor: 1.2, vol_fail_floor: 1.0, baseline_days: 20},
     logic_mode: python, logic_ref: "bt_engine.rules_p0::c2_volume_gate",
     logic_desc: "C2 量能確認 v1.0：突破日量≥1.5×20日均量；1.2-1.5×降級檔；v1.1 加 R9 時間尺度註解（日線 1.2-1.5×/日內 5×+ 禁混）",
     invalidation: "EXP-2026-001/002 分層判決證偽→撤回", supersedes: null,
     validation_experiment_id: "EXP-2026-001", notes: "<1.0×直接不合格（R9 硬門檻）"}
  - {rule_id: "P0.C2", version: "1.2.0", status: active, owner: quantitative, scope: [US,HK,CN],
     inputs: [volume, ma20_volume, ma21_volume], entry_effective: next_tradable_bar,
     parameters: {vol_gate: 1.5, vol_soft_floor: 1.2, vol_fail_floor: 1.0, amendment: "量能不足由單獨否決改為減半觀察檔（輔助訊號）；恢復判據=量能重回 21 日均量 1.0×"},
     logic_mode: python, logic_ref: "bt_engine.rules_p0::c2_volume_gate_v12",
     logic_desc: "C2 量能降級修訂（23/5）：量能不足→確認維持但倉位減半＋觀察標記；21 日量能中樞恢復為解除條件",
     invalidation: "EXP-2026-001 分層顯示降級檔期望值劣於硬門檻→回退", supersedes: "P0.C2@1.0.0",
     validation_experiment_id: "EXP-2026-001", notes: "2026-10-10 23/5 修訂"}
  - {rule_id: "P0.C3", version: "1.0.0", status: active, owner: quantitative, scope: [US,HK,CN],
     inputs: [close, breakout_level], entry_effective: next_tradable_bar,
     parameters: {window_days: 3, hold_days_required: 2, buffer_pct: 0.002},
     logic_mode: python, logic_ref: "bt_engine.rules_p0::c3_three_day_two_hold",
     logic_desc: "C3 三日二守：突破後 3 個交易日內≥2 日收於突破位＋0.2%上方；未守=假突破處置（移出/留觀）",
     invalidation: "EXP-2026-001 判決或 60 日統計（D3）證偽→撤回", supersedes: null,
     validation_experiment_id: "EXP-2026-001", notes: "v1.0→v1.2 承繼不變"}
  - {rule_id: "P0.E0", version: "1.0.0", status: retired, owner: quantitative, scope: [US,HK,CN],
     inputs: [event_calendar], entry_effective: event_window,
     parameters: {window_trading_days: 1, events: ["FOMC"], action: "只減不加"},
     logic_mode: python, logic_ref: "bt_engine.rules_p0::e0_event_filter",
     logic_desc: "E0 事件過濾器 v1.0：FOMC 決議日±1 交易日只減不加",
     invalidation: "EXP-2026-003 NO-GO→撤回", supersedes: null,
     validation_experiment_id: "EXP-2026-003", notes: "v1.0 定稿"}
  - {rule_id: "P0.E0", version: "1.2.0", status: active, owner: quantitative, scope: [US,HK,CN],
     inputs: [event_calendar, session], entry_effective: event_window,
     parameters: {window_trading_days: 1, events: ["FOMC"], action: "只減不加",
                  amendment: "事件時刻以決議公布時點錨定（23×5 跨時段）；事件日曆載入 market_data/calendar/fomc_calendar.json"},
     logic_mode: python, logic_ref: "bt_engine.rules_p0::e0_event_filter_v12",
     logic_desc: "E0 事件時刻更新（23/5）：公布時點錨定＋三地日曆對齊；全日曆回放驗證=EXP-2026-003",
     invalidation: "EXP-2026-003 NO-GO→撤回", supersedes: "P0.E0@1.0.0",
     validation_experiment_id: "EXP-2026-003", notes: "2026-10-10 23/5 修訂"}
  - {rule_id: "P0.E1", version: "1.0.0", status: active, owner: quantitative, scope: [US,HK,CN],
     inputs: [adx14, ma5, ma10, ma20, atr], entry_effective: next_tradable_bar,
     parameters: {adx_threshold: 20, entangle_rule: "MA5/10/20 高低差<1×ATR→纏繞", action: "突破類 setup 停做",
                  release: "ADX>20 且均線發散解除"},
     logic_mode: python, logic_ref: "bt_engine.rules_p0::e1_environment_filter",
     logic_desc: "E1 環境過濾器（v1.1 新增，掛載 P0 確認制）：whipsaw 環境自動停做突破類 setup",
     invalidation: "無失效條款（治理條款：失效即撤）", supersedes: null,
     validation_experiment_id: null, notes: "父條款=R6@1.0.0；兩處一體，改動須同步"}

